<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音频剪辑 · 个人工具箱</title>
  <link rel="icon" href="../../assets/icons/audio-cutter.svg">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    :root { --accent: #6366f1; }
    .top { display: flex; align-items: center; gap: 12px; padding: 28px 0 20px; }
    .top a { color: var(--muted); text-decoration: none; font-size: 14px; }
    .top a:hover { color: var(--text); }
    .top h1 { margin: 0; font-size: 22px; font-weight: 700; }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: clamp(16px, 3vw, 24px);
    }

    .drop {
      display: grid; place-items: center; gap: 8px; text-align: center;
      min-height: 240px; cursor: pointer;
      border: 2px dashed var(--border); border-radius: 12px;
      color: var(--muted); transition: border-color .2s, background .2s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .drop strong { color: var(--text); font-size: 16px; font-weight: 600; }
    .drop svg { width: 40px; height: 40px; color: var(--accent); }

    .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
    .meta b { color: var(--text); font-weight: 600; word-break: break-all; }
    .meta button { all: unset; cursor: pointer; color: var(--accent); }

    .wave {
      position: relative; height: clamp(140px, 24vw, 200px);
      border-radius: 10px; overflow: hidden;
      background: color-mix(in srgb, var(--text) 3%, transparent);
      touch-action: none; cursor: crosshair; user-select: none;
    }
    .wave canvas { display: block; width: 100%; height: 100%; }
    .timeline { display: flex; justify-content: space-between; font: 12px ui-monospace, monospace; color: var(--muted); margin-top: 6px; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; margin-top: 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    .field input[type=text], .field select {
      font: 14px ui-monospace, monospace; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; outline: none; width: 100%;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field .row { display: flex; justify-content: space-between; }
    .field input[type=range] { accent-color: var(--accent); width: 100%; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      font: inherit; font-size: 14px; font-weight: 500;
      padding: 9px 18px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      transition: all .15s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
    @media (max-width: 600px) { .hint { display: none; } }
    .status { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a href="../../">← 工具箱</a>
      <h1>音频剪辑</h1>
    </div>

    <section class="panel">
      <label id="drop" class="drop">
        <input id="file" type="file" accept="audio/*,video/*" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10v4M7 7v10M11 4v16M15 8v8M19 10v4"/></svg>
        <strong>点击选择或拖入音频文件</strong>
        <span>支持 MP3 / WAV / M4A / OGG / FLAC 等，文件仅在本地处理</span>
      </label>

      <div id="editor" hidden>
        <div class="meta">
          <span><b id="name"></b> · <span id="info"></span></span>
          <button id="reset" type="button">更换文件</button>
        </div>
        <div id="wave" class="wave"><canvas id="canvas"></canvas></div>
        <div class="timeline"><span>0:00.000</span><span id="total"></span></div>

        <div class="controls">
          <label class="field">开始
            <input id="start" type="text" inputmode="decimal" spellcheck="false">
          </label>
          <label class="field">结束
            <input id="end" type="text" inputmode="decimal" spellcheck="false">
          </label>
          <label class="field">时长
            <input id="len" type="text" readonly tabindex="-1">
          </label>
          <label class="field">模式
            <select id="mode">
              <option value="keep">保留选区</option>
              <option value="remove">删除选区</option>
            </select>
          </label>
          <label class="field"><span class="row">淡入 <span id="fadeInVal">0 s</span></span>
            <input id="fadeIn" type="range" min="0" max="5" step="0.1" value="0">
          </label>
          <label class="field"><span class="row">淡出 <span id="fadeOutVal">0 s</span></span>
            <input id="fadeOut" type="range" min="0" max="5" step="0.1" value="0">
          </label>
        </div>

        <div class="actions">
          <button id="play" class="btn" type="button">▶ 试听</button>
          <button id="all" class="btn" type="button">全选</button>
          <button id="export" class="btn primary" type="button">导出 WAV</button>
          <span class="hint">拖动波形选择区间 · 拖动边缘微调 · 空格播放</span>
        </div>
        <div id="status" class="status"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
