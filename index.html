<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人工具箱</title>
  <meta name="description" content="个人常用小工具合集">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><path d='M9 13h14v10H9zM13 13v-3h6v3' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1 id="site-title">个人工具箱</h1>
      <p id="site-subtitle" class="subtitle"></p>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜索工具…" autocomplete="off" aria-label="搜索工具">
        <kbd>/</kbd>
      </label>
    </div>
  </header>

  <main class="wrap">
    <nav id="filters" class="filters" aria-label="分类"></nav>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>没有找到匹配的工具</p>
  </main>

  <footer class="wrap footer" id="site-footer"></footer>

  <script src="assets/app.js"></script>
</body>
</html>
